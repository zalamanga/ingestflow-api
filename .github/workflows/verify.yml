name: Verify API
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate local synthetic keys
        run: python scripts/init_env.py
      - name: Validate Compose files
        env:
          INGESTFLOW_TEST_DB_PASSWORD: ci-isolated-synthetic-db-password
        run: |
          docker compose -f compose.yml -p ingestflow config --quiet
          docker compose -f compose.test.yml -p ingestflow-test config --quiet
      - name: Build test image
        env:
          INGESTFLOW_TEST_DB_PASSWORD: ci-isolated-synthetic-db-password
        run: docker compose -f compose.test.yml -p ingestflow-test build tests
      - name: Start isolated PostgreSQL
        env:
          INGESTFLOW_TEST_DB_PASSWORD: ci-isolated-synthetic-db-password
        run: docker compose -f compose.test.yml -p ingestflow-test up -d --wait --wait-timeout 120 db
      - name: Run unit, actual PostgreSQL, concurrency and SIGKILL recovery tests
        env:
          INGESTFLOW_TEST_DB_PASSWORD: ci-isolated-synthetic-db-password
        run: docker compose -f compose.test.yml -p ingestflow-test run --rm --no-deps tests
      - name: Build runtime and start API plus worker
        run: |
          docker compose -f compose.yml -p ingestflow build api
          docker compose -f compose.yml -p ingestflow up -d --wait --wait-timeout 180
      - name: Check real HTTP API and separate worker
        run: |
          set -a
          . ./.env
          set +a
          docker run --rm --network ingestflow_default -e INGESTFLOW_BASE_URL=http://api:8100 -e TENANT_ALPHA_KEY -e TENANT_BETA_KEY ingestflow-api:test python scripts/smoke.py
      - name: Check generated OpenAPI snapshot
        run: |
          docker run --rm --entrypoint python ingestflow-api:test -c 'import json,hashlib; from ingestflow.api import create_app; from ingestflow.config import Settings; s=Settings("postgresql://unused/unused",hashlib.sha256(b"a"*64).hexdigest(),hashlib.sha256(b"b"*64).hexdigest()); print(json.dumps(create_app(s).openapi(),indent=2))' > .local/openapi-current.json
          python -c 'import json; assert json.load(open("docs/openapi.json")) == json.load(open(".local/openapi-current.json"))'
      - name: Export verified runtime image
        run: docker save ingestflow-api:local | gzip > .local/ingestflow-runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ingestflow-runtime-image
          path: .local/ingestflow-runtime.tar.gz
          retention-days: 3
      - name: Show sanitized service logs on failure
        if: failure()
        run: docker compose -f compose.yml -p ingestflow logs --no-color --tail 60 api worker migrate
      - name: Stop only this project's services
        if: always()
        env:
          INGESTFLOW_TEST_DB_PASSWORD: ci-isolated-synthetic-db-password
        run: |
          docker compose -f compose.yml -p ingestflow down --remove-orphans
          docker compose -f compose.test.yml -p ingestflow-test down --remove-orphans
